<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyrac Studio</title>
  <meta name="description" content="Kyrac Studio — makers of Candy Voyage: Match 3 Puzzle for Android.">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root { --pink: #E0307A; --cream: #FFEECC; --text: #3A1A00; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #FFEECC 0%, #FFCCDD 55%, #AAEECC 100%);
    }
    main {
      width: 100%; max-width: 520px; background: #fff; border-radius: 24px;
      padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px rgba(170, 34, 85, .18);
    }
    h1 { margin: 0 0 6px; color: var(--pink); font-size: 30px; }
    .tag { margin: 0 0 24px; color: #7a5a4a; }
    h2 { margin: 0 0 6px; font-size: 20px; }
    .game-icon {
      display: block; width: 96px; height: 96px; margin: 0 auto 12px;
      border-radius: 22px; box-shadow: 0 6px 18px rgba(170, 34, 85, .25);
    }
    p { line-height: 1.5; }
    .links { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .links a {
      display: inline-block; padding: 10px 18px; border-radius: 999px; text-decoration: none;
      background: var(--pink); color: #fff; font-weight: 600;
    }
    .links a.secondary { background: #fff; color: var(--pink); border: 2px solid var(--pink); }
    footer { margin-top: 28px; font-size: 13px; color: #9a7f70; }
  </style>
</head>
<body>
  <main>
    <h1>Kyrac Studio</h1>
    <p class="tag">Independent mobile game developer</p>

    <img class="game-icon" src="candy-voyage-icon.png" width="96" height="96"
         alt="Candy Voyage app icon">
    <h2>Candy Voyage: Match 3 Puzzle</h2>
    <p>A sweet match-3 puzzle adventure for Android — swap candies, make special
      combos and sail across thousands of levels.</p>

    <div class="links">
      <a href="https://kyracstudio.github.io/candy-voyage-legal/privacy-policy.html">Privacy Policy</a>
      <a class="secondary" href="https://kyracstudio.github.io/candy-voyage-legal/terms.html">Terms of Service</a>
    </div>

    <footer>© 2026 Kyrac Studio</footer>
  </main>
</body>
</html>
